
name: Build Master Studio Ultimate VST3

on:
  workflow_dispatch:
  push:
    branches: [principal]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Configure CMake
        run: cmake -S master_studio_ultimate -B build -DJUCE_DIR="${{ github.workspace }}/JUCE" -A x64

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Master-Studio-Ultimate-VST3
          path: build/**/*.vst3/**
